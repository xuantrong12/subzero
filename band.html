  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f4f4f4; color: #333; }
    a { text-decoration: none; color: inherit; }
    
    /* Navigation Bar */
    .navbar { background: #53a653; color: #fff; font-size: 12px; font-weight: bold; position: sticky; top: 0; }
    .nav-container { max-width: 1200px; margin: 0 auto; display: flex; overflow-x: auto; }
    .nav-item, .menu-icon { padding: 14px 12px; white-space: nowrap; cursor: pointer; }
    .nav-item:hover, .nav-item.active { background: #3d803d; }

    /* Layout chính 3 cột */
    .content-container { max-width: 1200px; margin: 20px auto; padding: 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .column { background: #fff; padding: 15px; border-radius: 4px; }

    /* Nội dung Tin tức */

    .featured-news p { font-size: 13px; color: #666; line-height: 1.5; }
